[project]
name = "pakdk"
version = "0.1.0"
description = "Who stopped answering: nonresponse among Pakistani women in Pew's 2009 and 2014 Global Attitudes surveys"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "pyreadstat"]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
skip = "*.pdf,*.png,*.jpg,*.jpeg,*.gif,*.csv,*.tsv,*.json,*.geojson,*.graphml,*.ipynb,*.html,*.svg,*.bib,*.bbl,*.lock,*.parquet,*.rda,*.rds,*.RData,*.dta,*.xlsx,*.xml,*.min.js,*.map,*.log,*.aux"
ignore-words-list = "sav"
